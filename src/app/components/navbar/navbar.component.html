<div class="w-full">

    <p-toolbar [style]="{ 'border-radius': '0'}">
        <ng-template #start>
            <div class="flex items-center gap-2">
                <svg width="31" height="33" viewBox="0 0 31 33" fill="none" xmlns="http://www.w3.org/2000/svg"
                    style="width: 2rem; margin-right: 1rem">
                    <path d="..." fill="var(--p-primary-color)" />
                    <mask id="mask0_1_52" style="mask-type:luminance" maskUnits="userSpaceOnUse" x="0" y="0" width="31"
                        height="33"></mask>
                </svg>
                <p-button label="Files" text plain />
                <p-button label="Edit" text plain />
                <p-button label="View" text plain />
                <p-button label="Products" text plain [routerLink]="'/products'" />

            </div>
        </ng-template>

        <ng-template #end>
            <div class="flex items-center gap-2">
                <div *ngIf="isLoggedIn()">

                    <!-- <button >logout</button> -->
                    <p-button (click)="logout()" label="logout" severity="contrast" size="small" />

                </div>
                <div *ngIf="!isLoggedIn()">

                    <!-- <button >logout</button> -->
                    <p-button (click)="login()" label="Login" severity="contrast" size="small" />

                </div>
                <p-avatar image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
                    [style]="{ width: '32px', height: '32px' }" />
            </div>
        </ng-template>
    </p-toolbar>
</div>
